# Local MongoDB as a single-node replica set (required for transactions: fee payments, admissions).
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok}\""]
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  mongo-data:
